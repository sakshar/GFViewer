{% extends "base.html" %}
{% block title %}Error{% endblock %}

{% block content %}
<div class="card notice error-page">
    <h2>Something went wrong</h2>
    <p>{{ error_message }}</p>
    {% if hints %}
    <ul>
        {% for h in hints %}<li>{{ h }}</li>{% endfor %}
    </ul>
    {% endif %}
    <p><a class="btn" href="{{ url_for('main.index') }}">Back to the form</a></p>
</div>
{% endblock %}
